function nameChecker(words){
  const chosen = [];
  for(let a = 0; a < websites.length; a++){
    const webName = websites[a][0].toLowerCase().split(" ");
    let points = 0;
    for(let b = 0; b < words.length; b++){
      if(words[b].at(-1) == "s"){
        words[b] = words[b].slice(0, -1);
      }
      if(webName.includes(words[b]) && ! smallWords.includes(words[b])){
        points++;
      }
    }
    if(points != 0){
      chosen.push([a, points]);
    }
  }
  return chosen;
}

function ranker(chosen, oldChosen){
  const newChosen = chosen[0];
  const newPoints = chosen[1];
  for(let a = 0; a < oldChosen.length; a++){
    if(newChosen.includes(oldChosen[a][0])){
      const index = newChosen.indexOf(oldChosen[a][0]);
      newPoints[index] += oldChosen[a][1];
    } else {
      newChosen.push(oldChosen[a][0]);
      newPoints.push(oldChosen[a][1]);
    }
  }
  return [newChosen, newPoints];
}

function search(words){

  const tagPoints = tagChecker(wordsArray);

  let sites = [];
  [sites, points] = ranker([sites, points], namePoints);
